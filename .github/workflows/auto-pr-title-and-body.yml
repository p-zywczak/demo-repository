name: Auto PR title & fill {{TICKET}}

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Set PR title & replace {{TICKET}}
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const currentTitle = pr.title || '';
            const origBody = pr.body || '';

            const m = branch.match(/([a-zA-Z][a-zA-Z0-9]+-\d+)/i);
            if (!m) {
              core.notice('No JIRA key found in the branch name.');
              return;
            }
            const ticketRaw = m[1];
            const ticketUpper = ticketRaw.toUpperCase();
            const ticketLower = ticketRaw.toLowerCase();

            // Zbuduj "subject" po kluczu (np. "-zadanie" -> "zadanie")
            const idx = branch.toLowerCase().indexOf(ticketLower);
            let after = idx >= 0 ? branch.slice(idx + ticketRaw.length) : '';
            after = after.replace(/^[\/\-\_]+/, '');
            const subject = after.replace(/[-_]+/g, ' ').trim();

            // Tytuł: "<typ>/<ticketLower>: <subject>" (np. "feat/flex-124: zadanie")
            const typeSeg = (branch.split('/')[0] || '').toLowerCase(); // feat / fix / chore...
            const newTitle = `${typeSeg}/${ticketLower}` + (subject ? `: ${subject}` : '');

            // Treść PR: podmień wszystkie wystąpienia {{TICKET}}
            let body = origBody.replace(/{{\s*TICKET\s*}}/g, ticketUpper);

            // Aktualizuj PR tylko gdy coś się zmienia
            const needTitle = newTitle && currentTitle !== newTitle;
            const needBody  = body !== origBody;

            if (!needTitle && !needBody) {
              core.info('No changes to apply.');
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              title: needTitle ? newTitle : currentTitle,
              body: needBody ? body : origBody
            });

            core.notice(`Ustawiono: ${needTitle ? 'tytuł' : ''}${needTitle && needBody ? ' + ' : ''}${needBody ? 'treść' : ''}.`);
