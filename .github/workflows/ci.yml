name: DEVELOP-WORKFLOW

on:
  pull_request:
    types: [edited ,labeled, unlabeled, opened, synchronize, closed]
  push:
    branches:
      - develop
      - feat/*
  issue_comment:
    types: [created]
    
permissions: write-all
  
jobs:
  quality_checks:
        name: 'Quality checks'
        runs-on: ubuntu-latest
        services:
          mysql:
            image: mysql:8
            env:
              MYSQL_ROOT_PASSWORD: test_password
              MYSQL_DATABASE: testing
              MYSQL_USER: test_user
              MYSQL_PASSWORD: test_password
            ports:
              - 3306:3306
            options: >-
              --health-cmd="mysqladmin ping --silent"
              --health-interval=10s
              --health-timeout=5s
              --health-retries=3
    
          postgres:
            image: postgres:15-alpine
            env:
              POSTGRES_USER: test_user
              POSTGRES_PASSWORD: test_password
              POSTGRES_DB: testing
            ports:
              - 5432:5432
            options: >-
              --health-cmd="pg_isready -U test_user"
              --health-interval=10s
              --health-timeout=5s
              --health-retries=3
    
          redis:
            image: 'redis:alpine'
            ports:
              - 6379:6379
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.merged == false &&
          (github.event.action == 'opened' || github.event.action == 'synchronize') &&
          (
            (github.event.pull_request.base.ref == 'develop' &&
             github.event.pull_request.head.ref != 'main')
            ||
            (github.event.pull_request.base.ref == 'main' &&
             startsWith(github.event.pull_request.head.ref, 'hotfix/'))
            ||
            startsWith(github.event.pull_request.head.ref, 'release/')
          )
        steps:
          - name: Assign PR creator
            if: github.event_name == 'pull_request' && github.event.action == 'opened'
            uses: actions/github-script@v6
            with:
              script: |
                const prNumber = context.payload.pull_request.number;
                const prCreator = context.payload.pull_request.user.login;
    
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  assignees: [prCreator]
                });
    
          - name: Checkout repository
            if: github.event_name == 'pull_request'
            uses: actions/checkout@v3
    
          - name: Generate env.testing from .env.example
            run: |
              cp .env.example .env.testing
              sed -i 's|APP_KEY=.*|APP_KEY=base64:i4lYHYzzu3nGQoM9oeT3zrtCF3KMI0W691VRCFOGuNI=|' .env.testing
              sed -i 's|DISABLE_PERMISSIONS=.*|DISABLE_PERMISSIONS=false|' .env.testing
              sed -i 's|DB_HOST=.*|DB_HOST=127.0.0.1|' .env.testing
              sed -i 's|DB_DATABASE=.*|DB_DATABASE=testing|' .env.testing
              sed -i 's|DB_USERNAME=.*|DB_USERNAME=test_user|' .env.testing
              sed -i 's|DB_PASSWORD=.*|DB_PASSWORD=test_password|' .env.testing
              sed -i 's|REDIS_HOST=.*|REDIS_HOST=127.0.0.1|' .env.testing
    
          - name: Set up PHP
            uses: shivammathur/setup-php@v2
            with:
              php-version: 8.3.0
              tools: composer
              coverage: xdebug
    
          - name: Install dependencies via Composer
            run: composer install
    
          - name: Composer dump autoload
            run: composer dump-autoload
    
          - name: Run Migrations for Testing
            run: php artisan migrate --env=testing
    
          - name: Run Testing
            env:
              XDEBUG_MODE: coverage
            run: ./vendor/bin/phpunit --coverage-clover=coverage.xml
    
          - name: Extract coverage (percent, covered, total)
            id: cov
            run: |
              php -r '
                $x = simplexml_load_file("coverage.xml");
                $total = 0; $covered = 0;
                if (isset($x->project->metrics)) {
                  $m = $x->project->metrics;
                  $total = (int)$m["statements"];
                  $covered = (int)$m["coveredstatements"];
                } else {
                  foreach ($x->project->package as $pkg) {
                    foreach ($pkg->file as $f) {
                      $mm = $f->metrics;
                      $total  += (int)$mm["statements"];
                      $covered+= (int)$mm["coveredstatements"];
                    }
                  }
                }
                $pct = $total ? round($covered / $total * 100, 2) : 0;
                file_put_contents(getenv("GITHUB_OUTPUT"),
                  "percent=$pct\ncovered=$covered\ntotal=$total\n",
                  FILE_APPEND
                );
              '
    
          - name: Job summary
            run: |
              echo "### Code coverage" >> $GITHUB_STEP_SUMMARY
              echo "- Percent: **${{ steps.cov.outputs.percent }}%**" >> $GITHUB_STEP_SUMMARY
              echo "- Covered: **${{ steps.cov.outputs.covered }}** / **${{ steps.cov.outputs.total }}**" >> $GITHUB_STEP_SUMMARY

