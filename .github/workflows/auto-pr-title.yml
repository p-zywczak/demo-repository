name: Auto PR title from branch

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  title:
    # Bezpiecznie: działa tylko, gdy PR jest z tego samego repo (nie z forka)
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Set PR title from branch
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref; // np. feat/FLEX-123-cos-tam
            const currentTitle = pr.title || '';

            // 1) Wyciągnij klucz JIRA (np. FLEX-123)
            const m = branch.match(/([A-Z][A-Z0-9]+-\d+)/);
            const ticket = m ? m[1] : null;

            // 2) Zbuduj "ludzki" temat z reszty nazwy brancha
            function humanize(str) {
              if (!str) return '';
              // zamień slashe na myślniki, usuń leading separatory
              str = str.replace(/\//g, '-').replace(/^[-_]+/, '');
              // myślniki/underscores -> spacje
              str = str.replace(/[-_]+/g, ' ').trim();
              // wielka pierwsza litera
              return str ? str.charAt(0).toUpperCase() + str.slice(1) : '';
            }

            let subject = '';
            if (ticket) {
              const afterTicket = branch.split(ticket)[1] || '';
              subject = humanize(afterTicket);
            } else {
              // fallback: ostatni segment brancha
              subject = humanize(branch.split('/').pop());
            }

            const newTitle = ticket
              ? (subject ? `${ticket}: ${subject}` : `${ticket}`)
              : (subject || currentTitle || branch);

            // 3) Nie nadpisuj, jeśli już jest ok
            if (currentTitle === newTitle || (ticket && currentTitle.startsWith(ticket))) {
              core.info('Title already set — skipping update.');
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              title: newTitle
            });

            core.notice(`PR title set to: ${newTitle}`);
